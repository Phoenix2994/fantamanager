name: Deploy su GitHub Pages

on:
  workflow_dispatch: # Lancio manuale dal tab Actions

permissions:
  contents: write # Necessario per pushare sul branch gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci --legacy-peer-deps

      - name: Build produzione (base-href /fantamanager/)
        run: npm run build:prod

      - name: Deploy su gh-pages
        run: >
          npx -y angular-cli-ghpages
          --dir=dist/fantamanager/browser
          --no-silent
          --name="github-actions[bot]"
          --email="41898282+github-actions[bot]@users.noreply.github.com"
