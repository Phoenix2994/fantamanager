name: Aggiornamento Quotazioni Fantacalcio

on:
  schedule:
    # 22:00 CET in inverno = 21:00 UTC (nel periodo DST diventa 22:00 CEST).
    # GitHub Actions usa sempre UTC per i cron.
    - cron: '0 10 * * *'
  workflow_dispatch: # Permette di lanciarlo manualmente dal tab Actions

permissions:
  contents: read

jobs:
  update-quotazioni:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          # google-cloud-firestore bloccato sotto 2.20: le versioni 2.20.x
          # hanno un bug che causa INVALID_ARGUMENT "Invalid database id"
          pip install requests beautifulsoup4 firebase-admin \
            "google-cloud-firestore>=2.19,<2.20"

      - name: Aggiorna le quotazioni su Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/update_quotazioni.py --write
