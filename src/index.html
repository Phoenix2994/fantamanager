   <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <script>
    // Applica subito la preferenza di tema salvata, prima che Angular si
    // avvii: evita il lampo del tema scuro di default per chi ha scelto
    // quello chiaro (vedi ThemeService).
    try {
      if (localStorage.getItem('fantamanager.tema') === 'chiaro') {
        document.documentElement.classList.add('light-theme');
      }
    } catch (e) {
      // localStorage non disponibile: resta il tema scuro di default
    }
  </script>
