<div class="dashboard">
  <header class="app-header">
    <app-nav-menu />
    <mat-icon class="header-logo" aria-hidden="true">sports_soccer</mat-icon>
    <h1 class="app-title">{{ leagueName }}</h1>
    <span class="spacer"></span>
    <app-header-auth-status />
  </header>

  <!-- Squadra di riferimento: condivisa da tutte le sezioni, sempre visibile
       qualunque sezione si stia guardando (anche cambiando tab su mobile) -->
  <div class="team-bar">
    <mat-form-field appearance="fill" subscriptSizing="dynamic" class="team-select">
      <mat-label>Squadra</mat-label>
      <mat-select
        [value]="selection.selectedTeamId() ?? undefined"
        (selectionChange)="selection.select($event.value)"
      >
        @for (team of teams(); track team.id) {
          <mat-option [value]="team.id">{{ team.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Desktop (>1024px): 2 colonne sempre visibili -->
  @if (!isMobile() && !isTablet()) {
    <main class="content desktop">
      <section class="panel">
        <app-players-section />
      </section>
      <section class="panel">
        <app-finance-section />
      </section>
    </main>
  } @else if (isTablet()) {
    <!-- Tablet (640–1024px): giocatori a sinistra, tab spese/svincolati a destra -->
    <main class="content tablet">
      <section class="panel">
        <app-players-section />
      </section>
      <section class="panel tablet-tabs">
        <mat-tab-group animationDuration="0ms" dynamicHeight>
          <mat-tab label="Spese">
            <app-finance-section />
          </mat-tab>
          <mat-tab label="Svincolati">
            <app-svincolati-section />
          </mat-tab>
        </mat-tab-group>
      </section>
    </main>
  } @else {
    <!-- Mobile (<640px): tab Giocatori/Spese in alto, sezione a schermo pieno -->
    <main class="content mobile">
      <mat-tab-group
        animationDuration="0ms"
        dynamicHeight
        [selectedIndex]="mobileTab()"
        (selectedIndexChange)="mobileTab.set($event)"
      >
        <mat-tab label="Giocatori">
          <app-players-section />
        </mat-tab>
        <mat-tab label="Spese">
          <app-finance-section />
        </mat-tab>
      </mat-tab-group>
    </main>
  }
</div>
